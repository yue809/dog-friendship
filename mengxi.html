<script>
const types = [
{id:'tianran',name:'天然系',group:0,praise:'天生自带治愈力',rep:'本田透《水果篮子》',desc:'单纯、呆萌，偶尔有点迷糊，经常无意识地说出可爱又出乎意料的话。不是故意卖萌，而是真的天然。',core:'你有一种很难模仿的松弛感：不会把每一句话都算得太精，也愿意真心相信生活里的小美好。别人跟你相处，常常会不自觉地放下戒备。你不一定擅长处理所有复杂局面，却能让那些紧绷的时刻重新变得柔软。',keys:{w:2,p:2,o:2,t:1,c:-1},friends:['shouhu','jiaozi'],lovers:['qingxing','caoshi']},
{id:'tianranhei',name:'天然黑',group:0,praise:'天真里藏着锋芒',rep:'小杰《全职猎人》',desc:'外表天真无邪，看起来人畜无害，却会一本正经地说出令人震惊的话，自己还完全意识不到。',core:'你的特别之处，是柔软表面下那股不被套路牵着走的劲儿。你说话常常很直接，有时连自己都没意识到一句话有多精准。你不是刻意让别人难堪，只是眼睛里装着一套自己的逻辑；在熟悉的人看来，这种天然和敏锐并存的反差实在很有意思。',keys:{p:2,v:2,a:1,w:1,o:1},friends:['jiaozi','cannian'],lovers:['shouhu','yueguang']},
{id:'sanwu',name:'三无系',group:0,praise:'清冷又独一无二',rep:'绫波丽《新世纪福音战士》',desc:'无口、无心、无表情。话少，情绪不轻易外露，很难猜透内心，但不代表真的没有感情。',core:'你不像烟花那样需要被所有人看见，更像一盏安静亮着的小灯。情绪不总写在脸上，承诺也不会随便说出口；真正了解你的人，却能在许多小动作里读出在意。你擅长保留自己的步调，不必为了热闹勉强改变自己。',keys:{e:-2,g:2,s:2,d:1,p:-1},friends:['xianren','shenhai'],lovers:['shouhu','jiyu']},
{id:'fuli',name:'浮力系',group:0,praise:'自由得像一阵风',rep:'哈尔《哈尔的移动城堡》',desc:'像云朵一样轻飘飘的，温柔又有距离感。似乎很好接近，却总让人觉得抓不住。',core:'你让人舒服，是因为你愿意靠近，也敢于保留自己的天空。你有好奇心，能随着气氛改变节奏，却不喜欢被任何一段关系彻底定义。你不是没有深情，而是需要一种允许呼吸的亲密：彼此欣赏，也彼此自由。',keys:{t:2,i:2,m:1,s:1,c:-1},friends:['jiyu','qingxing'],lovers:['yueguang','caoshi']},
{id:'qingfu',name:'轻浮系',group:0,praise:'天生的魅力玩家',rep:'太宰治《文豪野犬》（言行气质参考）',desc:'说话随性，擅长调情，很容易制造暧昧氛围，但未必会认真投入感情。与浮力系不同，轻浮更多体现在言行与态度上。',core:'你很懂人与人之间微妙的节奏，一句话、一个眼神就能让普通场景多一点戏剧感。你的幽默和游刃有余很有感染力。不过你最动人的时候，不是所有人都被你逗笑，而是你愿意为某个人把玩笑说得认真。',keys:{m:2,p:2,r:1,l:-1,d:-1},friends:['cannian','jiyu'],lovers:['qingxing','roushi']},
{id:'baojiao',name:'暴娇系',group:0,praise:'热烈得鲜活可爱',rep:'逢坂大河《龙与虎》',desc:'傲娇的加强版。明明很在意对方，却习惯用激烈的态度掩饰害羞，容易炸毛，甚至出现夸张的暴力行为。',core:'你的情绪有速度，也有温度。越是重要的事情，反而越容易让你失去平常的从容；嘴上很凶，心里却早已把人放进了特别的位置。学会用直接但不伤人的话说出在意，会让你的热烈成为真正的礼物。',keys:{a:2,e:2,d:2,g:1,w:1},friends:['cannian','shouhu'],lovers:['xianren','qingxing']},
{id:'aochen',name:'傲沉系',group:0,praise:'别扭也藏着温柔',rep:'白鬼院凛凛蝶《妖狐×仆SS》',desc:'嘴上不愿坦率表达喜欢，事后又因为自己的别扭、说错的话或无法表达真心而独自消沉。',core:'你心里有很多细腻的对白，却未必能在当下顺利说出来。一次没讲好的话，可能被你回想很久。其实你并不缺少爱人的能力，只是太在乎自己的表达是否被认真接住。能让你放松的人，会发现你的体贴比表面更深。',keys:{g:2,d:2,n:1,e:-1,w:1},friends:['yueguang','jiaozi'],lovers:['shouhu','caoshi']},
{id:'bingjiao',name:'病娇系',group:0,praise:'角色戏剧张力拉满',rep:'我妻由乃《未来日记》',desc:'在喜欢的人面前格外温柔、依恋，但强烈的执念可能发展为极端占有、跟踪、威胁甚至暴力。这是虚构角色属性，不是健康关系的范本。',core:'在二次元叙事里，你对应的是投入感强、情绪浓度高的角色原型：一旦认定重要的人，很难敷衍或漫不经心。现实里的深情需要与尊重相伴；爱不应变成监视、威胁或限制。能够照顾好自己的边界，也尊重别人的选择，才会让这份认真变得温柔。',keys:{l:2,d:2,c:2,r:2,i:-2},friends:['qingxing','xianren'],lovers:['qingxing','shouhu']},
{id:'xianren',name:'仙人系',group:1,praise:'清醒通透有仙气',rep:'芙莉莲《葬送的芙莉莲》',desc:'情绪稳定，成熟通透，像隐居山林的仙人一样淡泊从容。不争不抢，有自己的精神世界。',core:'你不着急赢下每一次争论，也不觉得所有热闹都必须参与。你有自己的时间感，能平静地容纳人与事的起伏。你的成熟不是没有情绪，而是知道情绪来时如何安放它。越相处，别人越能发现你安静外表下稳定又有趣的精神世界。',keys:{s:2,i:2,g:1,d:1,o:1,c:-1},friends:['sanwu','qingxing'],lovers:['baojiao','shouhu']},

{id:'roushi',name:'肉食系',group:1,praise:'勇敢追爱的行动派',rep:'中野二乃《五等分的新娘》',desc:'喜欢就主动出击，不喜欢暧昧不清。敢于表达感情，目标明确，热情直接。',core:'你对自己的心意有行动力，不喜欢把关系无限卡在猜测里。明确、坦率是你最大的魅力之一：喜欢就认真靠近，不合适也有勇气面对。你能带给关系向前的动力，只需要记得，好的节奏来自两个人共同的选择。',keys:{a:2,r:2,e:2,i:1},friends:['qingxing','cannian'],lovers:['caoshi','yueguang']},

{id:'cannian',name:'残念系',group:1,praise:'漂亮又有趣的宝藏',rep:'藤原千花《辉夜大小姐想让我告白》',desc:'明明拥有令人心动的外表，却总在奇怪的地方掉链子。美貌与搞笑并存，反差感十足。',core:'你的可爱并不来自事事完美，而来自那种认真又有点跑偏的生命力。计划被打乱时，你能制造意料之外的笑点；心情不好的朋友，也常会被你的奇思妙想拉出低谷。正是那些不完美的小瞬间，让你显得格外真实。',keys:{p:2,o:2,c:-2,e:2},friends:['tianran','jiyu'],lovers:['shouhu','qingxing']},
{id:'duanshi',name:'断食系',group:1,praise:'独立闪耀有追求',rep:'娜美《海贼王》',desc:'比起恋爱，更愿意把时间投入事业、学习和兴趣。不是没有爱的能力，只是暂时觉得自己的生活已经足够精彩。',core:'你很清楚自己的能量要优先用在哪里。学习、梦想、兴趣和朋友已经能构成丰富的一天，你并不需要用恋爱来证明生活完整。适合你的亲密关系不是打断你的轨道，而是愿意欣赏你正在奔赴的目标。',keys:{i:2,r:-2,c:1,a:1},friends:['qingxing','xianren'],lovers:['yueguang','fuli']},
{id:'jueshi',name:'绝食系',group:1,praise:'一个人也很精彩',rep:'帕瓦《电锯人》',desc:'对恋爱缺乏兴趣，甚至有些抗拒进入亲密关系。享受独处，更重视个人自由和空间。',core:'你珍惜一个人时的自主和自由，不愿为了“大家都这样”就安排自己的感情生活。你有权决定关系是否进入、何时进入，也可以从友情、创作或兴趣中获得满足。你身上的独立感，会吸引那些同样尊重边界的人。',keys:{i:2,r:-2,s:2,g:1},friends:['xianren','wuqi'],lovers:['fuli','qingxing']},
{id:'nianren',name:'黏人系',group:2,praise:'满满爱意的小太阳',rep:'阿尼亚《间谍过家家》（亲情表现参考）',desc:'需要持续的回应与陪伴，通过频繁联系确认亲密感。喜欢分享生活，也希望被放在心上。',core:'你会把日常中的细枝末节都当作值得分享的心动：一首歌、一张图片、路边好吃的东西，都想第一时间发给重要的人。你能让关系充满被惦记的感觉。学会把安全感的一部分交给自己，也会让陪伴更轻盈。',keys:{l:2,r:2,e:2,s:-2,w:1},friends:['shouhu','tianran'],lovers:['shouhu','roushi']},
{id:'shouhu',name:'守护系',group:2,praise:'温柔坚定的守护者',rep:'灶门祢豆子《鬼灭之刃》',desc:'会将重要的人纳入自己的责任范围，愿意长期投入时间和精力保护对方。',core:'你表达爱时，常常是先做点什么：记住对方的习惯、留意他的难处、在关键时刻站到身边。你不一定天天说漂亮的话，但你的可靠会让人记很久。别忘记也把自己列入需要照顾的名单，温柔才可以持续。',keys:{w:2,l:2,c:1,a:1},friends:['tianran','caoshi'],lovers:['nianren','aochen']},
{id:'yilai',name:'依赖系',group:2,praise:'真挚柔软的灵魂',rep:'间桐樱《Fate/stay night》',desc:'容易把情感重心交给重要的人，对关系中的回应比较敏感，独自面对不安时可能缺乏稳定感。',core:'你重视关系里的确定感，收到认真回应时就会安心很多。因为感受细腻，你很容易记住对方的小善意，也愿意掏出自己的真心。练习保留独立的朋友、爱好和边界，不会减少深情，反而会让你更踏实。',keys:{l:1,r:2,d:2,i:-2,g:1},friends:['shouhu','yueguang'],lovers:['qingxing','shouhu']},

function makeResultText(){const r=currentResult;return `🎀 我的萌系属性：${r.main.name}\n💗 ${r.main.praise}\n🎀 代表：${r.main.rep}\n♡ 经典萌属性：${r.groups[0].name}\n♡ 恋爱与相处：${r.groups[1].name}\n♡ 情感与氛围：${r.groups[2].name}\n🧸 友情搭子：${r.main.friends.map(id=>values[id].name).join('、')}\n💌 心动搭子：${r.main.lovers.map(id=>values[id].name).join('、')}\n\n来测测你是什么萌系属性吧 ♡`}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('复制好啦，快发给朋友看看 ♡')}catch(e){const tmp=document.createElement('textarea');tmp.value=s;tmp.style.position='fixed';tmp.style.opacity='0';document.body.append(tmp);tmp.select();const ok=document.execCommand('copy');tmp.remove();toast(ok?'复制好啦 ♡':'复制失败，可以手动截图分享')}}
function copyResult(){copy(makeResultText())}
async function shareLink(){const url=location.href;const text=makeResultText();try{if(navigator.share&&location.protocol!=='file:'){await navigator.share({title:'萌系属性 🎀',text,url});return}}catch(e){if(e.name==='AbortError')return}if(location.protocol==='file:'){copy(text);toast('已复制结果！上传网页后还可以分享专属结果链接 ♡')}else copy(text+'\n'+url)}
function toast(s){const el=$('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2900)}
